{% extends 'shopapp/base.html' %}

{% block title %}
  Добавление товара
{% endblock %}

{% block body %}
  <h1>Добавить новый товар</h1>
  <div>
      <form method="post">
          {% csrf_token %}
          {{ form.as_p }}

          <button type="submit">
              Создать
          </button>
      </form>
  </div>

<div>
    <a href="{% url 'shopapp:products_list' %}">
        Вернуться к списку товаров</a>
</div>
{% endblock %}
